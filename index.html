<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Drawing canvas</title>
</head>
<body>
<section class="input_buttons">
  <button class="draw" >Draw </button>
  <button class="erase">Erase</button>
  <button class="undo" >Undo </button>
  <button class="clear">Clear</button>
  <button class="stamp">Stamp</button>
</section>
<div class="drawing_section">
    <section class = "color_size_buttons">
        
        <label for="size">Size:</label>
        <input type="range" id="size" name="size" min="1" max="50" value="10" step="1" oninput="sizeOut.value = this.value">
        <output id="sizeOut">10</output>



        <label for="color_picker">Color:</label>
        <input type="color" id="color_picker" value="#000000">


    </section>
    <section class = "canvas">
        <canvas>Smth</canvas>
    </section>     
</div>
<script src="index.js"></script>
</body>
</html>
